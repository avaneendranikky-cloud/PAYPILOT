status = warn
name = PayPilotLog4j2
monitorInterval = 60

# ANSI highlighting applies to the console. The rolling file stays plain text for easy search.
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.disableAnsi = false
appender.console.layout.noConsoleNoAnsi = false
appender.console.layout.pattern = %style{%d{yyyy-MM-dd}}{yellow} %style{%d{HH:mm:ss.SSS}}{cyan} %highlight{%-5level}{FATAL=bold white bg_bright_red, ERROR=bold bright_red, WARN=bold bright_yellow, INFO=bold bright_green, DEBUG=bright_magenta, TRACE=bright_blue} %style{[%t]}{magenta} %style{%c{1.}}{bright_cyan} - %msg%n%throwable
appender.file.type = RollingFile
appender.file.name = RollingFileAppender
appender.file.fileName = logs/paypilot.log
appender.file.filePattern = logs/archive/paypilot-%d{yyyy-MM-dd}-%i.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %c{1.} - %msg%n%throwable
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 7

rootLogger.level = info
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.file.ref = RollingFileAppender

logger.paypilot.name = com.paypilot.payments
logger.paypilot.level = debug
logger.paypilot.additivity = false
logger.paypilot.appenderRefs = console, file
logger.paypilot.appenderRef.console.ref = ConsoleAppender
logger.paypilot.appenderRef.file.ref = RollingFileAppender
